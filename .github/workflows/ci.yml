name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Checks out and taps this repository as pgedge/tap. Without the
      # token, git prompts for credentials on a non-public repository
      # and retries with backoff until the job is cancelled.
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # main
        with:
          token: ${{ github.token }}
      - name: brew style
        run: brew style pgedge/tap
      # Until the first release commits a cask, there is nothing to
      # audit, and brew audit fails on an empty tap.
      - name: brew audit
        run: |
          if compgen -G "$(brew --repo pgedge/tap)/Casks/*.rb" > /dev/null; then
            brew audit --cask --tap pgedge/tap
          fi
